name: Windows native compatibility

on:
  push:
    branches: [main, codex/windows-native]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Hermes ${{ matrix.hermes-version }} / Windows x64
    strategy:
      fail-fast: false
      matrix:
        include:
          - hermes-version: '0.23.0'
            hermes-commit: 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19
          - hermes-version: '0.23.1'
            hermes-commit: 3b421578588243f920886e6fe79a6faa87ea026e
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.9'
          architecture: x64
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes-commit }}
          path: hermes-host
          persist-credentials: false
      - name: Prepare exact official host and isolated profile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git -C hermes-host fetch --depth=1 origin refs/tags/v${{ matrix.hermes-version }}:refs/tags/v${{ matrix.hermes-version }}
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch official release tag' }
          $commit = git -C hermes-host rev-parse 'v${{ matrix.hermes-version }}^{commit}'
          if ($commit -ne '${{ matrix.hermes-commit }}') { throw 'Official tag mismatch' }
          $homePath = Join-Path $env:RUNNER_TEMP 'hermes-native-home'
          New-Item -ItemType Directory -Path $homePath -Force | Out-Null
          @(
            "HOME=$homePath"
            "USERPROFILE=$homePath"
            "LOCALAPPDATA=$homePath\AppData\Local"
            "APPDATA=$homePath\AppData\Roaming"
            "HERMES_HOME=$homePath\profile"
            "PYTHONDONTWRITEBYTECODE=1"
            "PYTHONUTF8=1"
            "GIT_CONFIG_GLOBAL=NUL"
            "GIT_CONFIG_NOSYSTEM=1"
            "GIT_TERMINAL_PROMPT=0"
            "GIT_CONFIG_COUNT=1"
            "GIT_CONFIG_KEY_0=core.autocrlf"
            "GIT_CONFIG_VALUE_0=true"
            "SCIFETCH_TEST_HERMES=$env:GITHUB_WORKSPACE\hermes-host"
            "SCIFETCH_TEST_HERMES_VERSION=${{ matrix.hermes-version }}"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          python -m pip install --disable-pip-version-check uv
          if ($LASTEXITCODE -ne 0) { throw 'Could not install uv' }
          Push-Location hermes-host
          try {
            uv pip install --system -e .
            if ($LASTEXITCODE -ne 0) { throw 'Could not prepare official Hermes dependencies' }
          } finally {
            Pop-Location
          }
      - name: Install public plugin with official CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\hermes-host"
          Remove-Item Env:GITHUB_TOKEN,Env:GH_TOKEN -ErrorAction SilentlyContinue
          $install = @('plugins', 'install', 'YogurtBiu/hermes-scifetch-plugin', '--no-enable')
          if ('${{ github.ref_name }}' -ne 'main') { $install += @('--ref', '${{ github.sha }}') }
          python -m hermes_cli.main @install
          if ($LASTEXITCODE -ne 0) { throw 'Official plugin installation failed' }
          python -m hermes_cli.main plugins enable scifetch-paper
          if ($LASTEXITCODE -ne 0) { throw 'Official plugin enable failed' }
          python -m hermes_cli.main plugins list --plain --no-bundled
          if ($LASTEXITCODE -ne 0) { throw 'Official plugin listing failed' }
      - name: Run native process and installed-plugin contracts
        env:
          SCIFETCH_TEST_EXPECTED_COMMIT: ${{ github.sha }}
        shell: pwsh
        run: |
          $env:SCIFETCH_TEST_PLUGIN = Join-Path $env:HERMES_HOME 'plugins\scifetch-paper'
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\hermes-host"
          python plugin/tests/test_windows_native.py
          if ($LASTEXITCODE -ne 0) { throw 'Native compatibility contract failed' }
